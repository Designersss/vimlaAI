services:
  postgres:
    image: postgres:16-alpine
    container_name: vimla-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vimla
      POSTGRES_PASSWORD: vimla
      POSTGRES_DB: vimla
    ports:
      - "5432:5432"
    volumes:
      - vimla_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vimla -d vimla"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: vimla-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vimla_postgres_data:
