name: Set up Vimla workspace
description: Install pinned pnpm, Node 24 and frozen monorepo dependencies with lockfile-scoped store cache
runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 10.17.0
    - name: Set up Node.js with pnpm store cache
      uses: actions/setup-node@v7
      with:
        node-version-file: .node-version
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml
    - name: Install dependencies from lockfile
      shell: bash
      run: pnpm install --frozen-lockfile
